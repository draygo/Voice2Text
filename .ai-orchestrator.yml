# Generated by ai-engineering-orchestrator onboarding. Read from the default branch only.
# CI runs on macos-26 (set in .github/workflows/ai-pipeline.yml). The app links
# whisper.xcframework from $HOME/VoiceInk-Dependencies; CI uses the prebuilt
# v1.8.6 release instead of compiling whisper.cpp for every Apple platform.
version: 1
adapter: generic
runtime: {}
commands:
  install: >-
    mkdir -p "$HOME/VoiceInk-Dependencies/whisper.cpp" &&
    curl -fsSL -o "${RUNNER_TEMP:-/tmp}/whisper-xcframework.zip"
    https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.6/whisper-v1.8.6-xcframework.zip &&
    unzip -q -o "${RUNNER_TEMP:-/tmp}/whisper-xcframework.zip" -d "$HOME/VoiceInk-Dependencies/whisper.cpp"
  unit: >-
    xcodebuild test -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Debug
    -destination 'platform=macOS' -derivedDataPath .ci-build -xcconfig LocalBuild.xcconfig
    CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""
    -only-testing:VoiceInkTests
review:
  codex_effort: medium
  block_on:
    - critical
    - high
repair:
  max_attempts: 3
  daily_cap: 6
approval:
  required: true
  approvers:
    - draygo
